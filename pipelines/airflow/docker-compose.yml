# Local Airflow (LocalExecutor + Postgres) for the retail sales pipeline.
#
#   cd pipelines/airflow
#   docker compose up -d --build      -> UI at http://localhost:8080
#   docker compose down               -> stop (add -v to also delete Airflow's database)
#
# Login user/password come from pipelines/airflow/.env (git-ignored, see .env.example).

x-airflow-common: &airflow-common
  build:
    context: ../..                        # project root, so the Dockerfile can copy requirements*.txt
    dockerfile: pipelines/airflow/Dockerfile
  image: retail-airflow:local
  env_file: .env
  environment:
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "false"
    PROJECT_DIR: /opt/project
    PROJECT_PYTHON_BIN: /opt/airflow/project-venv/bin
    FEAST_USAGE: "False"
    LOKY_MAX_CPU_COUNT: "4"
  volumes:
    - ./dags:/opt/airflow/dags            # our DAG files
    - ./logs:/opt/airflow/logs            # task logs (git-ignored)
    - ../..:/opt/project                  # the whole project (code, DVC, data, .env for MLflow)
  depends_on:
    postgres:
      condition: service_healthy

services:
  postgres:                               # Airflow's own metadata database (not our data)
    image: postgres:16
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow          # only reachable inside this compose network
      POSTGRES_DB: airflow
    volumes:
      - airflow-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 10s
      retries: 5

  airflow-init:                           # one-time: create tables + the admin login
    <<: *airflow-common
    entrypoint: /bin/bash
    command: -c "airflow db migrate && airflow users create --role Admin --username $${AIRFLOW_ADMIN_USER} --password $${AIRFLOW_ADMIN_PASSWORD} --firstname Admin --lastname User --email admin@example.com || true"

  airflow-webserver:
    <<: *airflow-common
    command: webserver
    ports:
      - "127.0.0.1:8080:8080"             # only reachable from this laptop
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    restart: unless-stopped

  airflow-scheduler:                      # starts DAG runs on schedule and executes the tasks
    <<: *airflow-common
    command: scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  airflow-db:
