# ------------------------------------------------------------------
# Candidate models and their hyperparameter grids.
# train.py tries EVERY combination below, logs each one to MLflow,
# and keeps the one with the lowest validation SMAPE.
# ------------------------------------------------------------------

models:
  ridge:                       # simple linear model (fast baseline)
    alpha: [1.0, 10.0]

  random_forest:
    n_estimators: [50]
    max_depth: [12]
    max_samples: [0.3]         # each tree sees 30% of rows -> much faster
    n_jobs: [-1]

  hist_gradient_boosting:      # sklearn's fast gradient boosting (like LightGBM)
    max_iter: [200, 400]
    learning_rate: [0.05, 0.1]
    max_depth: [8]
